<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClinIQ — الرعاية الصحية بذكاء</title>
  <meta name="description" content="منصة ClinIQ لاكتشاف الأطباء والحجز والمساعدة الذكية">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">Q</span><div><b>ClinIQ</b><small>رعاية أذكى</small></div></div>
      <nav id="sideNav"></nav>
      <div class="sidebar-card"><span>✦</span><b>اسأل المساعد الذكي</b><small>ساعدني أختار التخصص المناسب</small><button data-go="patient-ai">ابدأ المحادثة</button></div>
      <div class="user-mini"><div class="avatar">يم</div><div><b>يوسف منصور</b><small>حساب مريض</small></div><button id="logout">↪</button></div>
    </aside>

    <main>
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="search"><span>⌕</span><input id="globalSearch" placeholder="ابحث عن طبيب، تخصص أو عيادة..."></div>
        <div class="role-switch"><button data-role="patient" class="active">مريض</button><button data-role="doctor">طبيب</button><button data-role="admin">إدارة</button></div>
        <button class="icon-btn" data-go="notifications">♧<i>3</i></button>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="modal-card"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
  <script src="app.js"></script>
</body></html>
